<section
  class="featured-projects-section relative"
  id="projects"
  aria-labelledby="featured-projects-heading"
>
  <div class="section-background absolute inset-0" aria-hidden="true"></div>
  <div class="relative z-10 max-w-6xl mx-auto px-6">
    <div
      class="flex flex-col gap-y-8 sm:flex-row sm:justify-between sm:items-center mb-12"
    >
      <h2 id="featured-projects-heading" class="section-title text-3xl">
        {{ "PROJECTS.FEATURED" | translate }}
      </h2>
      <a
        routerLink="/projects"
        class="view-all-link"
        aria-label="View all projects"
      >
        {{ "PROJECTS.VIEW_ALL" | translate }}
      </a>
    </div>

    <div class="projects-grid" role="list" aria-label="Featured projects">
      @for (project of featuredProjects(); track project) {
      <article
        class="project-card material-card overflow-hidden mb-8 cursor-pointer backdrop-blur-sm"
        [routerLink]="['/project', project.id]"
        role="listitem"
        tabindex="0"
        [attr.aria-label]="project.title + ' project'"
      >
        <div class="project-image">
          @if (project.thumbnails && project.thumbnails.length > 0) {
          <picture>
            <source [srcset]="project.thumbnails[0].avif" type="image/avif" />
            <source [srcset]="project.thumbnails[0].webp" type="image/webp" />
            <img
              [src]="project.thumbnails[0].png"
              [alt]="project.title + ' thumbnail'"
              class="mockup w-full h-full object-cover"
            />
          </picture>
          } @if (project.logo) {
          <picture>
            <source [srcset]="project.logo.avif" type="image/avif" />
            <source [srcset]="project.logo.webp" type="image/webp" />
            <img
              [src]="project.logo.png"
              [alt]="project.title + ' logo'"
              class="logo w-full h-full"
              [style.background-color]="
                project.logo.backgroundColor || 'transparent'
              "
            />
          </picture>
          }
        </div>
        <div class="project-content sm:p-6">
          <h3 class="text-[18px] sm:text-2xl font-playfair text-white">
            {{ project.title }}
          </h3>
          <p class="project-description text-gray-300 text-[14px] sm:text-base">
            {{ project.subtitle }}
          </p>
        </div>
      </article>
      }
    </div>
  </div>
</section>
