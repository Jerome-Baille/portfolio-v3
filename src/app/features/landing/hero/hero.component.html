<div
  class="h-[100vh] flex flex-col justify-center items-center"
  role="region"
  aria-labelledby="name-heading"
>
  <div
    class="business-card bg-white shadow-lg border border-gray-200 relative overflow-hidden"
    role="banner"
  >
    <!-- Card texture overlay -->
    <div
      class="card-texture absolute inset-0 pointer-events-none"
      aria-hidden="true"
    ></div>
    <div class="elevation-layer" aria-hidden="true"></div>

    <!-- Card edge effects for thickness -->
    <div class="card-edge" aria-hidden="true"></div>
    <div class="card-edge-left" aria-hidden="true"></div>
    <div class="card-edge-bottom" aria-hidden="true"></div>
    <div class="card-bottom-shadow" aria-hidden="true"></div>

    <div class="relative z-10 flex flex-col items-center w-full">
      <h1
        id="name-heading"
        class="debossed-text font-['Whisper'] text-center"
        data-text="Jérôme Baille"
      >
        Jérôme Baille
      </h1>
      <div class="separator-line" aria-hidden="true"></div>
      <h2 class="role-text font-['Lato'] text-gray-700">
        {{ "HERO.ROLE" | translate }}
      </h2>
    </div>
  </div>
</div>
